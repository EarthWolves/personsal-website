      <figure class="shot reveal"><div class="ph g1" style="aspect-ratio:4/5"></div><figcaption>San Diego, golden hour</figcaption></figure>

      <figure class="shot reveal"><div class="ph g2" style="aspect-ratio:3/4"></div><figcaption>Coast</figcaption></figure>
      <figure class="shot reveal"><div class="ph g1" style="aspect-ratio:4/3"></div><figcaption>Desert road</figcaption></figure>
